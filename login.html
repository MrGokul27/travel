<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Tripex Travel Agency</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Custom CSS Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <!-- ====== Login Form Section ====== -->
    <section class="login-form-sec">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="contact-form-wrapper reveal reveal-zoom-in">
              <div class="text-center mb-4">
                <a href="index.html">
                  <img
                    src="assets/images/logoStackly.webp"
                    alt="Stackly Logo"
                    class="login-page-logo"
                    style="max-height: 50px"
                  />
                </a>
              </div>
              <div class="section-title text-center mb-4">
                <span class="sub-title">Welcome Back</span>
                <h2 class="mb-0">Login to Your Account</h2>
              </div>
              <form
                class="tripex-contact-form"
                id="login-form"
                autocomplete="off"
              >
                <div class="row g-4">
                  <div class="col-12">
                    <label class="form-label fw-bold text-dark">Login As</label>
                    <select
                      class="form-select theme-role-select"
                      name="role"
                      required
                    >
                      <option value="user">Traveler / User</option>
                      <option value="guide">Tour Guide</option>
                      <option value="agency">Travel Agency</option>
                      <option value="admin">Administrator (Admin)</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <input
                      type="email"
                      class="form-control"
                      placeholder="Email Address"
                      name="email"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <input
                      type="password"
                      class="form-control"
                      placeholder="Password"
                      name="password"
                      required
                    />
                  </div>
                  <div
                    class="col-12 d-flex justify-content-between align-items-center"
                  >
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe"
                        name="remember"
                      />
                      <label
                        class="form-check-label text-muted small"
                        for="rememberMe"
                      >
                        Remember Me
                      </label>
                    </div>
                    <a href="#" class="text-orange small fw-bold"
                      >Forgot Password?</a
                    >
                  </div>
                  <div class="col-12 text-center mt-4">
                    <button type="submit" class="theme-btn style-one w-100">
                      Login Now <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                  </div>
                  <div class="col-12 text-center mt-3">
                    <p class="mb-0">
                      Don't have an account?
                      <a href="register.html" class="text-orange fw-bold"
                        >Register here</a
                      >
                    </p>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Interaction Script -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
