<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Tripex Travel Agency</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <!-- ====== Start 404 Section ====== -->
    <section class="error-page-sec">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="error-content reveal reveal-fade-up active">
              <div class="error-img">
                <i class="fas fa-map-signs fa-10x text-primary opacity-25"></i>
              </div>
              <div class="error-code">404</div>
              <h2>Oops! Destination Not Found</h2>
              <p>
                The page you are looking for might have been removed, had its
                name changed, or is temporarily unavailable. It seems you've
                taken a wrong turn on your journey!
              </p>
              <div class="error-button">
                <a href="index.html" class="theme-btn style-one">
                  <i class="fas fa-home me-2"></i> Back To Home
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- ====== End 404 Section ====== -->

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
