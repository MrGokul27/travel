<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Tripex Travel Agency</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Custom CSS Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/contact.css" />
  </head>

  <body>
    <!-- ====== Register Form Section ====== -->
    <section class="tripex-contact-form-sec login-form-sec">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-7">
            <div class="contact-form-wrapper reveal reveal-zoom-in">
              <div class="section-title text-center mb-4">
                <span class="sub-title">Join Tripex</span>
                <h2>Start Your Journey With Us</h2>
              </div>
              <form
                class="tripex-contact-form"
                id="register-form"
                autocomplete="off"
              >
                <div class="row g-4">
                  <div class="col-12">
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Full Name"
                      name="name"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <input
                      type="email"
                      class="form-control"
                      placeholder="Email Address"
                      name="email"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      type="password"
                      class="form-control"
                      placeholder="Password"
                      name="password"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      type="password"
                      class="form-control"
                      placeholder="Confirm Password"
                      name="confirm_password"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="termsCheck"
                        name="terms"
                        required
                      />
                      <label
                        class="form-check-label text-muted small"
                        for="termsCheck"
                      >
                        I agree to the
                        <a href="#" class="text-orange fw-bold"
                          >Terms & Conditions</a
                        >
                        and Privacy Policy.
                      </label>
                    </div>
                  </div>
                  <div class="col-12 text-center mt-4">
                    <button type="submit" class="theme-btn style-one w-100">
                      Create Account <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                  </div>
                  <div class="col-12 text-center mt-3">
                    <p class="mb-0">
                      Already have an account?
                      <a href="login.html" class="text-orange fw-bold"
                        >Sign In here</a
                      >
                    </p>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Interaction Script -->
    <script src="assets/js/script.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const registerForm = document.getElementById("register-form");
        if (registerForm) {
          registerForm.addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent the default form submission
            // In a real application, you would send the form data to a server here.
            // After successful registration (or for demonstration), redirect to the login page.
            window.location.href = "login.html";
          });
        }
      });
    </script>
  </body>
</html>
