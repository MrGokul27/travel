<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Tripex Travel Agency</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Custom CSS Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <!-- ====== Register Form Section ====== -->
    <section class="login-form-sec">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="contact-form-wrapper reveal reveal-zoom-in">
              <div class="text-center mb-4">
                <a href="index.html">
                  <img
                    src="assets/images/logoStackly.webp"
                    alt="Stackly Logo"
                    class="login-page-logo"
                    style="max-height: 50px"
                  />
                </a>
              </div>

              <div class="section-title text-center mb-4">
                <span class="sub-title">Join Tripex</span>
                <h2 class="mb-0">Start Your Journey With Us</h2>
              </div>
              <form
                class="tripex-contact-form"
                id="register-form"
                autocomplete="off"
              >
                <div class="row g-4">
                  <div class="col-12">
                    <label class="form-label fw-bold text-dark"
                      >Register As</label
                    >
                    <select
                      class="form-select theme-role-select"
                      name="role"
                      required
                    >
                      <option value="user">Traveler / User</option>
                      <option value="guide">Tour Guide</option>
                      <option value="agency">Travel Agency</option>
                      <option value="admin">Administrator (Admin)</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Full Name"
                      name="name"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <input
                      type="email"
                      class="form-control"
                      placeholder="Email Address"
                      name="email"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <div class="position-relative">
                      <input
                        type="password"
                        class="form-control"
                        placeholder="Password"
                        name="password"
                        minlength="8"
                        pattern="(?=.*[A-Z]).+"
                        required
                      />
                      <i class="fas fa-eye password-toggle-icon"></i>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="position-relative">
                      <input
                        type="password"
                        class="form-control"
                        placeholder="Confirm Password"
                        name="confirm_password"
                        minlength="8"
                        pattern="(?=.*[A-Z]).+"
                        required
                      />
                      <i class="fas fa-eye password-toggle-icon"></i>
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="termsCheck"
                        name="terms"
                        required
                      />
                      <label
                        class="form-check-label text-muted small"
                        for="termsCheck"
                      >
                        I agree to the
                        <a href="#" class="text-orange fw-bold"
                          >Terms & Conditions</a
                        >
                        and Privacy Policy.
                      </label>
                    </div>
                  </div>
                  <div class="col-12 text-center mt-4">
                    <button type="submit" class="theme-btn style-one w-100">
                      Create Account <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                  </div>
                  <div class="col-12 text-center mt-3">
                    <p class="mb-0">
                      Already have an account?
                      <a href="login.html" class="text-orange fw-bold"
                        >Sign In here</a
                      >
                    </p>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Interaction Script -->
    <script src="assets/js/script.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const registerForm = document.getElementById("register-form");
        if (registerForm) {
          registerForm.addEventListener("submit", function (event) {
            event.preventDefault(); // Stop standard form submission

            // 1. Check native validation (required fields, email format, etc.)
            if (!registerForm.checkValidity()) {
              registerForm.reportValidity();
              return;
            }

            const passwordInput =
              registerForm.querySelector('[name="password"]');
            const confirmInput = registerForm.querySelector(
              '[name="confirm_password"]',
            );

            if (passwordInput.value !== confirmInput.value) {
              confirmInput.setCustomValidity("Passwords do not match.");
              confirmInput.reportValidity();

              // Reset the validation state once the user starts typing again
              confirmInput.addEventListener(
                "input",
                function () {
                  confirmInput.setCustomValidity("");
                },
                { once: true },
              );

              return;
            }

            // After successful registration (or for demonstration), redirect to the login page.
            window.location.href = "login.html";
          });
        }
      });
    </script>
  </body>
</html>
